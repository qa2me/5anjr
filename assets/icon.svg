<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A6CF7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Inner glow -->
  <rect x="4" y="4" width="120" height="60" rx="28" ry="28" fill="url(#glow)"/>

  <!-- Microphone body -->
  <rect x="49" y="34" width="30" height="40" rx="15" ry="15" fill="white" opacity="0.95"/>

  <!-- Microphone top arc -->
  <path d="M49 44 Q49 34 64 34 Q79 34 79 44" fill="white" opacity="0.95"/>

  <!-- Mic stand -->
  <rect x="61" y="74" width="6" height="16" rx="3" ry="3" fill="white" opacity="0.8"/>

  <!-- Mic base -->
  <rect x="52" y="88" width="24" height="5" rx="2.5" ry="2.5" fill="white" opacity="0.8"/>

  <!-- Sound wave left -->
  <path d="M34 52 Q28 56 28 64 Q28 72 34 76" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Sound wave far left -->
  <path d="M22 46 Q14 52 14 64 Q14 76 22 82" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Sound wave right -->
  <path d="M94 52 Q100 56 100 64 Q100 72 94 76" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Sound wave far right -->
  <path d="M106 46 Q114 52 114 64 Q114 76 106 82" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35"/>
</svg>
